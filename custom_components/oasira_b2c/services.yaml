
update_entity:
  name: Update entity
  description: Update an entity in the entity registry with an area
  fields:
    entity_id:
      name: Entity
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    area_id:
      name: Area
      description: The new area to assign to the entity
      example: "living_room"
      required: true
      selector:
        area:

add_label_to_entity:
  name: Add label to entity
  description: Add a label to an entity
  fields:
    entity_id:
      name: Entity
      description: The entity to label
      example: "light.kitchen"
      required: true
      selector:
        entity:

    label:
      name: Label
      description: The label to add
      example: "Favorite"
      required: true
      selector:
        text:

add_virtual_power_device:
  name: Add virtual power device
  description: Add or update a virtual power profile used for total home consumption estimation
  fields:
    entity_id:
      name: Entity
      description: Entity to monitor. Required unless always_on is true.
      example: "switch.washing_machine"
      selector:
        entity:

    name:
      name: Name
      description: Friendly name for this profile. Required when always_on is true.
      example: "Router"
      selector:
        text:

    wattage:
      name: Wattage
      description: Estimated power draw in watts
      required: true
      example: 120
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          unit_of_measurement: W

    always_on:
      name: Always on
      description: Set true for fixed devices that are always consuming power
      default: false
      selector:
        boolean:

remove_virtual_power_device:
  name: Remove virtual power device
  description: Remove a virtual power profile by entity_id or name
  fields:
    entity_id:
      name: Entity
      description: Entity id of the virtual power profile to remove
      example: "switch.washing_machine"
      selector:
        entity:

    name:
      name: Name
      description: Profile name to remove (useful for always_on devices)
      example: "Router"
      selector:
        text:

deploy_latest_config:
  name: Deploy latest config
  description: Deploy latest Oasira blueprints

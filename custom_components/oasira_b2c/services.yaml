# Service to clean motion files older than specified age
clean_motion_files:
  fields:
    age:
      description: The age of the files to remove in days. Default is 30 days.
      example: 30
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: days

# Add a label to an entity
add_label_to_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    label:
      description: The label to apply to the entity
      example: "favorite"
      required: true
      selector:
        label:

# Create an alert record
create_alert:
  target: {}
  fields:
    alert_type:
      description: The type of the alert
      example: "Humidity Alert"
      required: true
      selector:
        text:
    alert_description:
      description: Details about the alert
      required: true
      selector:
        text:
          multiline: true
    status:
      description: The status of the alert
      example: "Active"
      required: true
      selector:
        select:
          options:
            - "Active"
            - "Resolved"
            - "Acknowledged"

# Confirm pending Oasira alarm
confirm_pending_alarm:
  target: {}
# Cancel Oasira alarm
cancel_alarm:
  target: {}

# Get Oasira alarm status
get_alarm_status:
  target: {}

update_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    area_id:
      description: The new area to assign to the entity
      example: "living_room"
      required: true
      selector:
        area:

add_virtual_power_device:
  name: Add Virtual Power Device
  description: Add or update a virtual power profile used for total home consumption estimation
  fields:
    entity_id:
      description: Entity to monitor. Required unless always_on is true.
      example: "switch.washing_machine"
      selector:
        entity:

    name:
      description: Friendly name for this profile. Required when always_on is true.
      example: "Router"
      selector:
        text:

    wattage:
      description: Estimated power draw in watts
      required: true
      example: 120
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          unit_of_measurement: W

    always_on:
      description: Set true for fixed devices that are always consuming power
      default: false
      selector:
        boolean:

remove_virtual_power_device:
  name: Remove Virtual Power Device
  description: Remove a virtual power profile by entity_id or name
  fields:
    entity_id:
      description: Entity id of the virtual power profile to remove
      example: "switch.washing_machine"
      selector:
        entity:

    name:
      description: Profile name to remove (useful for always_on devices)
      example: "Router"
      selector:
        text:

# Deploy latest Oasira config
deploy_latest_config:
  target: {}


create_event:
  target: {}
  fields:
    entity_id:
      description: The entity that triggered the event
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity: